apiVersion: v1
kind: ConfigMap
metadata:
  name: acquisitions-api-config
data:
  NODE_ENV: production
  PORT: '5000'
  API_PREFIX: /api/v1
  TRUST_PROXY: '1'
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  BCRYPT_ROUNDS: '10'
  COOKIE_SECURE: 'true'
  COOKIE_SAMESITE: lax
  LOG_LEVEL: info
  ARCJET_ENV: production
  ARCJET_RATE_LIMIT_INTERVAL: '60'
  ARCJET_RATE_LIMIT_MAX: '60'
  ARCJET_AUTH_RATE_LIMIT_MAX: '20'
