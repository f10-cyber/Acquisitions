# Copy to secret.yaml, fill in real values, and apply it manually.
# Never commit a populated secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: acquisitions-api-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@endpoint-pooler.region.aws.neon.tech/dbname?sslmode=require
  JWT_SECRET: change-me-to-a-long-random-secret-min-32-chars
  CLIENT_ORIGIN: https://your-frontend.example.com
  COOKIE_DOMAIN: your-frontend.example.com
  ARCJET_KEY: ajkey_your_arcjet_site_key
